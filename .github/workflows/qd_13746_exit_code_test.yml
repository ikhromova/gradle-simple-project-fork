name: QD-13746 Exit Code Tests

on:
  workflow_dispatch:

jobs:

  # 1. Threshold NOT exceeded → exit 0, step passes
  threshold-not-exceeded:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Qodana (--fail-threshold 999 → expect exit 0)
        uses: JetBrains/qodana-action@main
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: "--linter qodana-jvm --fail-threshold 999"

  # 2. severityThresholds.critical: 0 with critical problems → exit 255
  severity-threshold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject qodana.yaml with severityThresholds.critical
        run: |
          cat > qodana.yaml << 'EOF'
          version: "1.0"
          failureConditions:
            severityThresholds:
              critical: 0
          EOF
      - name: Run Qodana (severityThresholds.critical:0 → expect exit 255)
        uses: JetBrains/qodana-action@main
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: "--linter qodana-jvm"

  # 3. Invalid token → exit ≠ 255
  invalid-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Qodana (invalid token → expect exit ≠ 255)
        uses: JetBrains/qodana-action@main
        env:
          QODANA_TOKEN: "invalid-token-12345"
        with:
          args: "--linter qodana-jvm"

  # 4. if: failure() runs correctly after exit 255
  if-failure-after-threshold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Qodana (--fail-threshold 0 → expect exit 255)
        uses: JetBrains/qodana-action@main
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: "--linter qodana-jvm --fail-threshold 0"
      - name: VERIFY — must run after exit 255
        if: failure()
        run: echo "PASS — if failure() step correctly ran after Qodana exit 255"

  # 5. Baseline (empty) + failThreshold 2 → all problems are "new" → exit 255
  baseline-with-threshold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create empty baseline SARIF
        run: |
          cat > "$GITHUB_WORKSPACE/qodana-baseline.sarif.json" << 'EOF'
          {"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Qodana","rules":[]}},"results":[]}]}
          EOF
      - name: Run Qodana (empty baseline + --fail-threshold 2 → expect exit 255)
        uses: JetBrains/qodana-action@main
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: "--linter qodana-jvm --fail-threshold 2 --baseline ${{ github.workspace }}/qodana-baseline.sarif.json"
