name: QD-13746 Exit Code Test

on:
  workflow_dispatch:

jobs:
  test-exit-code-255:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qodana (fail threshold 0 → expect exit 255)
        id: qodana
        uses: JetBrains/qodana-action@main
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: "--linter qodana-jvm --fail-threshold 0"
