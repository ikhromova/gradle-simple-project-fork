version: 1.0
projectJDK: "21"
bootstrap: echo "org.gradle.java.home=$(dirname $(dirname $(readlink -f $(which java))))" >> gradle.properties
profile:
  name: qodana.recommended
failureConditions:
  testCoverageThresholds:
    fresh: 10
    total: 10
include:
  - name: VulnerableLibrariesGlobal
  - name: VulnerableLibrariesLocal
  - name: PhpVulnerablePathsInspection
  - name: CheckDependencyLicenses
  - name: RiderSecurityErrorsInspection
